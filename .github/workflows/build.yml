name: Rebuild dashboard

on:
  push:
    branches: [main]
    paths:
      - "EPR Command Dashboard v3 WHO blue.dc.html"
      - "data.json"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.html
        run: python3 build.py

      - name: Commit the rebuilt files
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "EPR Command Dashboard v3 WHO blue.dc.html"
          if git diff --cached --quiet; then
            echo "Nothing changed — index.html already up to date."
          else
            git commit -m "Rebuild index.html"
            git push
          fi
